version: '3.8'

secrets:
  db_password:
    file: ./secrets/db_password.txt
  grafana_password:
    file: ./secrets/grafana_password.txt

services:
  caddy:
    image: caddy:2-alpine
    container_name: veetrack-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - backend

  backend:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: veetrack-backend
    restart: always
    env_file: .env
    expose:
      - "8000"
    command: ["gunicorn", "main:app", "-k", "uvicorn.workers.UvicornWorker", "--bind", "0.0.0.0:8000", "--workers", "4"]
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started

  celery_cpu:
    build: .
    container_name: veetrack-celery-cpu
    command: ["celery", "-A", "celery_app", "worker", "-Q", "cpu", "--concurrency=4", "--loglevel=info"]
    env_file: .env
    depends_on:
      - redis
      - db

  celery_gpu:
    build: .
    container_name: veetrack-celery-gpu
    command: ["celery", "-A", "celery_app", "worker", "-Q", "gpu", "--concurrency=2", "--loglevel=info"]
    env_file: .env
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      - redis
      - db

  celery_beat:
    build: .
    container_name: veetrack-celery-beat
    command: ["celery", "-A", "celery_app", "beat", "--loglevel=info"]
    env_file: .env
    depends_on:
      - redis

  db:
    image: postgres:15-alpine
    container_name: veetrack-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: veetrack
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: veetrack-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

  prometheus:
    image: prom/prometheus:latest
    container_name: veetrack-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:latest
    container_name: veetrack-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_password
    secrets:
      - grafana_password
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  caddy_data:
  caddy_config:
